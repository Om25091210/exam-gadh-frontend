<!doctype html>
<html lang="hi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ExamGadh — ऑफ़लाइन / Offline</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #fbf9f5; color: #1c1917; display: grid; min-height: 100vh; place-items: center; margin: 0; padding: 1rem; text-align: center; }
      main { max-width: 26rem; }
      img { width: 120px; height: 120px; mix-blend-mode: multiply; }
      button { min-height: 44px; padding: 0 1.25rem; border-radius: 12px; border: 0; background: #0e6350; color: #fff; font-size: 1rem; font-weight: 600; }

  </head>
  <body>
    <main>
      <img src="/logo.png" alt="" />
      <h1>इंटरनेट नहीं है / You are offline</h1>
      <p>कनेक्शन लौटने पर फिर कोशिश करें। चालू टेस्ट के उत्तर आपके डिवाइस पर सुरक्षित हैं।</p>
      <p>Check your connection and try again. Answers in a running test are kept safely on your device.</p>
      <button onclick="location.reload()">फिर कोशिश करें / Try again</button>
    </main>
  </body>
